name: V2 roadmap completion regression
on:
  pull_request:
    paths:
      - 'web/**'
      - 'apps/site/src/app/api/intel/**'
      - 'apps/site/src/app/api/cron/**'
      - 'apps/site/src/lib/terminal/engines/**'
      - 'tests/v2-roadmap-completion.py'
      - '.github/workflows/v2-roadmap-completion.yml'
permissions:
  contents: read
jobs:
  compiled-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/v2-roadmap-contracts.test.mjs
      - run: npm --prefix web ci
      - run: npm --prefix web run build
        env:
          VITE_BASE: /terminal/
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/v2-roadmap-completion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-roadmap-completion-evidence
          path: test-results/v2-roadmap/
          retention-days: 7
          if-no-files-found: ignore
