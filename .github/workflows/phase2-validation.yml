name: Phase 2 validation

on:
  push:
    branches:
      - audit/production-bug-sweep-2026-09-04
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json

      - name: Resolve patched terminal lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate terminal dependencies and production build
        working-directory: web
        run: |
          npm ci --include=dev
          npm audit --audit-level=high
          npm run typecheck
          npm run build

      - name: Validate native application TypeScript
        working-directory: mobile
        run: |
          npm ci --include=dev
          npm run typecheck

      - name: Commit regenerated terminal lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/production-bug-sweep-2026-09-04'
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "Terminal lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore(web): synchronize patched terminal lockfile [skip ci]"
          git push origin HEAD:audit/production-bug-sweep-2026-09-04
