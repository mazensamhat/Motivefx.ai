name: Bounded chunk recovery
on:
  pull_request:
    paths:
      - 'apps/site/src/app/global-error.tsx'
      - 'apps/site/src/lib/chunk-recovery.ts'
      - 'apps/site/scripts/chunk-recovery.test.mjs'
      - 'tests/build-chunk-recovery-fixture.mjs'
      - 'tests/chunk-recovery-browser.py'
      - '.github/workflows/chunk-recovery.yml'
permissions:
  contents: read
jobs:
  browser-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix web ci --include=dev
      - run: node --experimental-strip-types --test apps/site/scripts/chunk-recovery.test.mjs
      - run: node tests/build-chunk-recovery-fixture.mjs
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/chunk-recovery-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk-recovery-evidence
          path: test-results/chunk-recovery/
          retention-days: 7
          if-no-files-found: ignore
