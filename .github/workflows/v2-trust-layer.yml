name: V2 trust layer regression
on:
  pull_request:
    paths:
      - 'web/src/components/MotiveV2TrustLayer.tsx'
      - 'web/src/components/MotiveV2Home.tsx'
      - 'web/src/components/ModuleSidebar.tsx'
      - 'web/src/styles/v2-trust.css'
      - 'apps/site/src/app/api/intel/track-record/**'
      - 'tests/v2-trust-layer.py'
      - '.github/workflows/v2-trust-layer.yml'
permissions:
  contents: read
jobs:
  compiled-trust-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix web ci
      - run: npm --prefix web run build
        env:
          VITE_BASE: /terminal/
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/v2-trust-layer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-trust-layer-evidence
          path: test-results/v2-trust/
          retention-days: 7
          if-no-files-found: ignore
